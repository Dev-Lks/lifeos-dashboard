services:
  lifeos:
    build: .
    container_name: lifeos-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8700"
      LIFEOS_DATA_DIR: /data
    ports:
      - "8700:8700"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
